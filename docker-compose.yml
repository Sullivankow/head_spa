services:
  postgres:
    image: postgres:16-alpine
    container_name: headspa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: headspa
      POSTGRES_PASSWORD: headspa
      POSTGRES_DB: headspa
    ports:
      - "5433:5432"
    volumes:
      - headspa_pgdata:/var/lib/postgresql/data
volumes:
  headspa_pgdata:
